[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
eyre = "0.6.14"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
pcore = { path = "../pcore" }
pcore-gen = { path = "../pcore-gen" }
# `all` is needed for `original_dst_v4` / `original_dst_v6`.
socket2 = { version = "0.6.5", features = ["all"] }
flate2 = "1.1.10"
